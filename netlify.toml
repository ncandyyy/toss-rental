# Netlify 배포 설정
# 빌드 과정 없이 public 폴더를 그대로 올립니다.
[build]
  publish = "public"
  command = ""

# 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 이미지/영상 캐시는 넷리파이 기본값(매번 바뀌었는지 확인)을 씁니다.
# 같은 파일명으로 이미지를 교체해도 바로 반영됩니다.
